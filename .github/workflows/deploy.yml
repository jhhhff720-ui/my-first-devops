name: CI-CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 拉取代码
      uses: actions/checkout@v3

    - name: 登录 Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}

    - name: 构建并推送镜像
      run: |
        # 修正用户名为 zdzdevops
        docker build -t zdzdevops/myapp:latest .
        docker push zdzdevops/myapp:latest

    - name: SSH 到服务器并部署
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          docker pull zdzdevops/myapp:latest
          docker stop myapp || true
          docker rm myapp || true
          docker run -d \
            --name myapp \
            -p 80:5000 \
            zdzdevops/myapp:latest
